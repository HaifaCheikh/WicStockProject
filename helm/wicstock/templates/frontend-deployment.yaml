{{- if .Values.modules.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wicstock.fullname" . }}-frontend
  labels:
    {{- include "wicstock.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.registry }}/{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- if eq .Values.resources.profile "dev" }}
            requests:
              cpu: {{ .Values.resources.dev.frontend.requests.cpu }}
              memory: {{ .Values.resources.dev.frontend.requests.memory }}
            limits:
              cpu: {{ .Values.resources.dev.frontend.limits.cpu }}
              memory: {{ .Values.resources.dev.frontend.limits.memory }}
            {{- else }}
            requests:
              cpu: {{ .Values.resources.prod.frontend.requests.cpu }}
              memory: {{ .Values.resources.prod.frontend.requests.memory }}
            limits:
              cpu: {{ .Values.resources.prod.frontend.limits.cpu }}
              memory: {{ .Values.resources.prod.frontend.limits.memory }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wicstock.fullname" . }}-frontend-service
  labels:
    {{- include "wicstock.labels" . | nindent 4 }}
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend
{{- end }}
