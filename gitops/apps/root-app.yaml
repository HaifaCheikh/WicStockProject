apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wicstock-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HaifaCheikh/WicStockProject.git
    targetRevision: feat/k8s-namespaces-validation
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
