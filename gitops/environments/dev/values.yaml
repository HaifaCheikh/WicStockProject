# gitops/environments/dev/values.yaml
# Environnement Dev GitOps pour Argo CD (Tags immuables)

environment: "dev"
images:
  registry: "ghcr.io/haifacheikh/wicstockproject"
  pullPolicy: "IfNotPresent"
  backend:
    repository: "wicstock-api"
    tag: "3dc622c3f02e4f43e1e7b04bd4560bc4863939db"
  frontend:
    repository: "wicstock-web"
    tag: "3dc622c3f02e4f43e1e7b04bd4560bc4863939db"
  aiService:
    repository: "wicstock-ai"
    tag: "3dc622c3f02e4f43e1e7b04bd4560bc4863939db"
resources:
  profile: "dev"
replicas:
  backend: 1
  frontend: 1
  aiService: 1
  postgres: 1
modules:
  core:
    enabled: true
  ai:
    enabled: true
  observability:
    enabled: true
persistence:
  postgres:
    enabled: true
    storageClass: ""
    size: "1Gi"
  chromadb:
    enabled: true
    storageClass: ""
    size: "1Gi"
  prometheus:
    enabled: false
    retentionTime: "2h"
    size: "5Gi"
ingress:
  enabled: true
  className: "nginx"
  host: "wicstock.local"
grafana:
  adminUser: "admin"
  adminPassword: "CHANGE_ME_LOCAL_DEV_PASSWORD"
