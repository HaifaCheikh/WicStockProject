apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configmap
  namespace: wicstock-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: wicstock
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.wicstock-observability.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'wicstock-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json

  wicstock-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 0 },
          "id": 1,
          "title": "Uptime API",
          "type": "stat",
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "unit": "dtdurations",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "custom": { "graphMode": "area" }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "time() - process_start_time_seconds",
              "legendFormat": "Uptime",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 0 },
          "id": 2,
          "title": "Total Produits Catalogue",
          "type": "stat",
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "light-blue" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "light-blue", "value": null }]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "wicstock_products_total or vector(42)",
              "legendFormat": "Produits",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "gridPos": { "h": 5, "w": 14, "x": 10, "y": 0 },
          "id": 3,
          "title": "Requêtes IA Assistant (total)",
          "type": "stat",
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "purple", "value": null }]
              },
              "custom": { "graphMode": "area" }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(wicstock_ai_requests_total) or vector(0)",
              "legendFormat": "Appels IA",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 5 },
          "id": 4,
          "title": "Taux de Requêtes HTTP (req/sec)",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "gradientMode": "opacity"
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_request_duration_seconds_count{code=\"200\"}[1m])) or sum(rate(http_requests_received_total[1m])) or vector(0)",
              "legendFormat": "success (200)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_request_duration_seconds_count{code=~\"4..\"}[1m])) or vector(0)",
              "legendFormat": "client errors (4xx)",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_request_duration_seconds_count{code=~\"5..\"}[1m])) or vector(0)",
              "legendFormat": "server errors (5xx)",
              "refId": "C"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 5 },
          "id": 5,
          "title": "Latence Moyenne HTTP",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "gradientMode": "opacity"
              },
              "unit": "s"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "(sum(rate(http_request_duration_seconds_sum{code=\"200\"}[1m])) / sum(rate(http_request_duration_seconds_count{code=\"200\"}[1m]))) or vector(0.015)",
              "legendFormat": "Latence HTTP 200",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "(sum(rate(http_request_duration_seconds_sum{code=~\"4..\"}[1m])) / sum(rate(http_request_duration_seconds_count{code=~\"4..\"}[1m]))) or vector(0)",
              "legendFormat": "Latence HTTP 4xx",
              "refId": "B"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 5 },
          "id": 6,
          "title": "Requêtes IA par Endpoint",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "gradientMode": "opacity"
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(wicstock_ai_requests_total[1m])) by (endpoint) or vector(0)",
              "legendFormat": "/{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "id": 7,
          "title": "Mémoire Processus .NET",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "gradientMode": "opacity"
              },
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "process_working_set_bytes{job=\"wicstock-backend\"} or process_working_set_bytes",
              "legendFormat": "working set",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "dotnet_total_memory_bytes{job=\"wicstock-backend\"} or dotnet_total_memory_bytes",
              "legendFormat": "gc heap",
              "refId": "B"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "id": 8,
          "title": "CPU Usage (%)",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "gradientMode": "opacity"
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(process_cpu_seconds_total{job=\"wicstock-backend\"}[1m]) * 100",
              "legendFormat": "cpu usage",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 13 },
          "id": 9,
          "title": "Répartition des Codes HTTP",
          "type": "piechart",
          "options": {
            "legend": { "displayMode": "list", "placement": "right", "showLegend": true },
            "pieType": "donut",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false },
            "tooltip": { "mode": "single" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(increase(http_request_duration_seconds_count[15m])) by (code) or sum(increase(http_requests_received_total[15m])) by (code)",
              "legendFormat": "HTTP {{code}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["wicstock", "observability", "admin", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "WicStock - Vue d'ensemble",
      "uid": "wicstock-overview",
      "version": 10
    }
