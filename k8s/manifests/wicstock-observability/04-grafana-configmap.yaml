apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configmap
  namespace: wicstock-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: wicstock
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.wicstock-observability.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'wicstock-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json

  wicstock-overview.json: |
    {
      "id": null,
      "uid": "wicstock-overview",
      "title": "WicStock - Vue d'ensemble",
      "tags": ["wicstock", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "title": "Services UP (wicstock-backend)",
          "type": "stat",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "Prometheus"},
            "expr": "count(up{job=\"wicstock-backend\"})",
            "legendFormat": "Pods Ready",
            "refId": "A"
          }],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"value": null, "color": "red"}, {"value": 1, "color": "green"}]}}}
        },
        {
          "id": 2,
          "title": "Taux de requêtes HTTP (req/sec)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 9, "x": 6, "y": 0},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "Prometheus"},
            "expr": "sum(rate(http_requests_received_total{job=\"wicstock-backend\"}[1m])) or sum(rate(http_request_duration_seconds_count[1m])) or vector(0)",
            "legendFormat": "req/sec",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 3,
          "title": "Latence p95 (backend)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 9, "x": 15, "y": 0},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "Prometheus"},
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) or vector(0)",
            "legendFormat": "p95 latency",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 4,
          "title": "CPU Usage (%) — Processus .NET",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "Prometheus"},
            "expr": "rate(process_cpu_seconds_total{job=\"wicstock-backend\"}[1m]) * 100",
            "legendFormat": "CPU %",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 5,
          "title": "RAM (bytes) — Processus .NET",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "Prometheus"},
            "expr": "process_working_set_bytes{job=\"wicstock-backend\"}",
            "legendFormat": "RAM Bytes",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "palette-classic"}}}
        }
      ],
      "time": {"from": "now-15m", "to": "now"}
    }
