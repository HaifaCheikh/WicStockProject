apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configmap
  namespace: wicstock-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: wicstock
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.wicstock-observability.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'wicstock-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json

  wicstock-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Services UP (wicstock-backend)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "count(up{job=\"wicstock-backend\"})",
              "legendFormat": "Pods Ready",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Taux de requêtes HTTP (req/sec)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 10, "x": 4, "y": 0},
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "cyan" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "showPoints": "never"
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(http_requests_received_total{job=\"wicstock-backend\"}[1m])) or sum(rate(http_request_duration_seconds_count[1m]))",
              "legendFormat": "req/sec",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latence p95 (backend)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 10, "x": 14, "y": 0},
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "showPoints": "never"
              },
              "unit": "s"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "CPU Usage (%) — Processus .NET",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "orange" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "opacity",
                "showPoints": "never"
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(process_cpu_seconds_total{job=\"wicstock-backend\"}[1m]) * 100",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "RAM (bytes) — Processus .NET",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "light-blue" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "showPoints": "never"
              },
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "process_working_set_bytes{job=\"wicstock-backend\"}",
              "legendFormat": "working set",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["wicstock", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "WicStock - Vue d'ensemble",
      "uid": "wicstock-overview",
      "version": 25
    }
