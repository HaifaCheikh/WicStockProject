apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: wicstock-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: wicstock
type: Opaque
# SECURITY NOTICE: Do not commit plain text secrets to public repositories.
# In production, inject secrets via CI/CD (kubectl create secret), SOPS, or External Secrets Operator.
# Example CLI creation:
#   kubectl create secret generic grafana-secret --from-literal=GF_SECURITY_ADMIN_USER=admin --from-literal=GF_SECURITY_ADMIN_PASSWORD=<PASSWORD> -n wicstock-observability
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_LOCAL_DEV_PASSWORD"

