# k8s/kind-config.yaml
# Configuration kind optimisée pour le développement local (2 nœuds : 1 control-plane, 1 worker)
# Redirige les ports 80 et 443 de l'hôte vers le control-plane pour NGINX Ingress Controller.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wicstock-cluster

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
