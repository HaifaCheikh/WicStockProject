services:
  - type: web
    name: wicstock-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AppSettings__BaseUrl
        value: https://wicstock-api.onrender.com
      - key: AppSettings__FrontendUrl
        value: https://wicstock-project.vercel.app
      - key: WhatsAppService__Url
        value: https://wicstock-whatsapp-haifa.onrender.com/send

  - type: web
    name: wicstock-ai
    env: docker
    rootDir: ai-service
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: wicstock-whatsapp-haifa
    env: docker
    rootDir: whatsapp-service
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 3001
