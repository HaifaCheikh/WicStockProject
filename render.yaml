services:
  - type: web
    name: wicstock-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AppSettings__BaseUrl
        value: https://wicstock-api.onrender.com
      - key: AppSettings__FrontendUrl
        value: https://wicstock-project.vercel.app
