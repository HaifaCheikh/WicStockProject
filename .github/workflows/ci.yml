name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'gitops/**'
      - 'README.md'
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Build Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        run: dotnet restore backend/WicStock.Api.csproj

      - name: Build Backend
        run: dotnet build backend/WicStock.Api.csproj --configuration Release --no-restore

  frontend:
    name: Build Frontend (Blazor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore Frontend
        run: dotnet restore frontend/WicStock.Web.csproj

      - name: Build Frontend
        run: dotnet build frontend/WicStock.Web.csproj --configuration Release --no-restore

  ai-service:
    name: Validate AI Service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install AI Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt

  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    steps:
      - uses: actions/checkout@v7

      - name: Build Backend Docker Image
        run: docker build -t wicstock-api ./backend

      - name: Build Frontend Docker Image
        run: docker build -t wicstock-web ./frontend

      - name: Build AI Service Docker Image
        run: docker build -t wicstock-ai ./ai-service

      - name: Build WhatsApp Service Docker Image
        run: docker build -t wicstock-whatsapp ./whatsapp-service

  trivy-scan:
    name: Trivy Security Scan (Docker Images)
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker Images for Scan
        run: |
          docker build -t wicstock-api ./backend
          docker build -t wicstock-web ./frontend
          docker build -t wicstock-ai ./ai-service
          docker build -t wicstock-whatsapp ./whatsapp-service

      # 1. Scan Image Backend (SARIF -> GitHub Security - Librairies applicatives)
      - name: Run Trivy scanner on Backend image (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wicstock-api'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Backend Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      # 2. Scan Image Frontend (SARIF -> GitHub Security - Librairies applicatives)
      - name: Run Trivy scanner on Frontend image (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wicstock-web'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Frontend Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      # 3. Scan Image AI Service (SARIF -> GitHub Security - Librairies applicatives)
      - name: Run Trivy scanner on AI Service image (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wicstock-ai'
          format: 'sarif'
          output: 'trivy-ai-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload AI Service Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-ai-results.sarif'
          category: 'trivy-ai-service'

      # 4. Scan Image WhatsApp Service (SARIF -> GitHub Security - Librairies applicatives)
      - name: Run Trivy scanner on WhatsApp Service image (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wicstock-whatsapp'
          format: 'sarif'
          output: 'trivy-whatsapp-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload WhatsApp Service Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-whatsapp-results.sarif'
          category: 'trivy-whatsapp-service'

  docker-push-ghcr:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend API Image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wicstock-api"
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Build & Push Frontend Image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wicstock-web"
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./frontend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Build & Push AI Service Image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wicstock-ai"
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./ai-service
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  update-gitops-manifests:
    name: Update GitOps Image Tags
    runs-on: ubuntu-latest
    needs: [docker-push-ghcr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update tags with yq
        run: |
          yq -i '.images.backend.tag = "${{ github.sha }}"' gitops/environments/dev/values.yaml
          yq -i '.images.frontend.tag = "${{ github.sha }}"' gitops/environments/dev/values.yaml
          yq -i '.images.aiService.tag = "${{ github.sha }}"' gitops/environments/dev/values.yaml

      - name: Commit and push updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): bump image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push

