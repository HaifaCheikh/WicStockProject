name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1' # Exécution automatique tous les lundis à 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# Projects (Backend & Frontend)
        run: |
          dotnet restore backend/WicStock.Api.csproj
          dotnet build backend/WicStock.Api.csproj --configuration Release --no-restore
          dotnet restore frontend/WicStock.Web.csproj
          dotnet build frontend/WicStock.Web.csproj --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
