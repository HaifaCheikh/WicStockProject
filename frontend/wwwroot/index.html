<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WicStock.Web</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WicStock.Web.styles.css" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
// Interop Turnstile inlined to avoid 404 on static file
window.turnstileInterop = {
    widgetId: null,
    dotnetRef: null,

    render: function (containerId, siteKey, dotnetRef) {
        window.turnstileInterop.dotnetRef = dotnetRef;

        const tryRender = () => {
            if (window.turnstile) {
                window.turnstileInterop.widgetId = window.turnstile.render("#" + containerId, {
                    sitekey: siteKey,
                    theme: "light",
                    callback: function (token) {
                        dotnetRef.invokeMethodAsync("OnCaptchaSuccess", token);
                    },
                    "error-callback": function () {
                        dotnetRef.invokeMethodAsync("OnCaptchaError");
                    },
                    "expired-callback": function () {
                        dotnetRef.invokeMethodAsync("OnCaptchaExpired");
                    }
                });
            } else {
                setTimeout(tryRender, 100);
            }
        };
        tryRender();
    },

    reset: function () {
        if (window.turnstile && window.turnstileInterop.widgetId !== null) {
            window.turnstile.reset(window.turnstileInterop.widgetId);
        }
    }
};
    </script>
    <script>
// Scroll smooth vers un élément par son ID (interop Blazor)
window.scrollToElement = function (elementId) {
    const el = document.getElementById(elementId);
    if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
};
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/localStorage.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
