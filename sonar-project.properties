# SonarCloud Configuration for WicStock
sonar.projectKey=HaifaCheikh_WicStockProject
sonar.organization=haifacheikh

# Primary source folders to analyze
sonar.sources=backend,frontend,ai-service

# Exclusions: third-party libs, generated files, binaries, raw SQL dumps, RAG vectors, migrations
sonar.exclusions=**/Migrations/**, **/bin/**, **/obj/**, **/wwwroot/**, backend/manual_migration.sql, ai-service/chroma_db/**, **/*.sql, **/node_modules/**

# Test files configuration
sonar.tests=backend/WicStock.Api.Tests
sonar.test.inclusions=backend/WicStock.Api.Tests/**/*.cs

# Cobertura test coverage path (matches GitHub Actions CI output directory ./coverage-results)
sonar.cs.cobertura.reportsPaths=coverage-results/**/coverage.cobertura.xml
sonar.sourceEncoding=UTF-8
