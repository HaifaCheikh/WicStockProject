# SonarCloud Configuration for WicStock
sonar.projectKey=HaifaCheikh_WicStockProject
sonar.organization=haifacheikh

# Primary source folders to analyze
sonar.sources=backend,frontend,ai-service

# Exclusions from static analysis: third-party libs, generated files, binaries, raw SQL dumps, RAG vectors, migrations
sonar.exclusions=**/Migrations/**, **/bin/**, **/obj/**, **/wwwroot/**, backend/manual_migration.sql, ai-service/chroma_db/**, **/*.sql, **/node_modules/**

# Code Coverage Exclusions
# Exclude files from code coverage calculation that are not targeted by backend unit tests
# (Frontend Blazor WebAssembly, Python AI service, Controllers, DTOs, Program.cs, migrations, and mock-only integrations)
# These files are still analyzed for security, bugs, and code smells, but are excluded from coverage Quality Gate thresholds.
sonar.coverage.exclusions=frontend/**, ai-service/**, whatsapp-service/**, backend/Controllers/**, backend/Models/Dtos/**, backend/Migrations/**, backend/Program.cs, backend/Services/LemonSqueezyService.cs, backend/Services/EmailService.cs, backend/Services/WhatsAppService.cs

# Test files configuration
sonar.tests=backend/WicStock.Api.Tests
sonar.test.inclusions=backend/WicStock.Api.Tests/**/*.cs

# Cobertura test coverage path (matches GitHub Actions CI output directory ./coverage-results)
sonar.cs.cobertura.reportsPaths=coverage-results/**/coverage.cobertura.xml
sonar.sourceEncoding=UTF-8

# Python environment version specification (resolves SonarCloud analysis warning)
sonar.python.version=3.10, 3.11, 3.12
